[project]
name = "tokenmon"
version = "0.1.6"
description = "A fast, zero-dependency command-line monitor for local AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tokenmon = "tokenmon.cli:main"

[project.urls]
Repository = "https://github.com/quanhua92/tokenmon"
Changelog = "https://github.com/quanhua92/tokenmon/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenmon"]
