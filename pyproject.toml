[project]
name = "tokenmon"
version = "0.1.0"
description = "First-principles zero-dependency CLI monitor for local AI coding agent telemetry and token throughput"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tokenmon = "tokenmon.cli:main"

[project.urls]
Repository = "https://github.com/quanhua92/tokenmon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenmon"]
