name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed on main (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

# Do not interrupt a release while it is uploading distributions.
concurrency:
  group: pypi-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Validate and build release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          expected = os.environ["RELEASE_VERSION"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          module = ast.parse(pathlib.Path("src/tokenmon/__init__.py").read_text())
          runtime_versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          ]
          if project["name"] != "tokenmon":
              raise SystemExit("Unexpected PyPI project name")
          if project["version"] != expected or runtime_versions != [expected]:
              raise SystemExit("Input version, pyproject.toml, and __version__ must match")
          print(f"Validated tokenmon {project['version']}")
          PY
      - name: Run tests before publishing
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install -r .github/requirements-build.txt
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Check package metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Check installed release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I - <<'PY'
          import os
          from importlib.metadata import version
          from tokenmon import __version__

          expected = os.environ["RELEASE_VERSION"]
          if version("tokenmon") != expected or __version__ != expected:
              raise SystemExit("Built distribution version does not match the requested release")
          PY
          tokenmon --version
          python -I -m tokenmon --help
      - name: Store validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated distributions
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tokenmon/
    # Only this job can request the short-lived PyPI publishing identity.
    permissions:
      id-token: write
    steps:
      - name: Download this run's validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
