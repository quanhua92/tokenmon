name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR code runs without secrets, write permissions, or publishing credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install -r .github/requirements-build.txt
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Check package metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Check installed CLI
        run: |
          python -m pip install --no-deps dist/*.whl
          tokenmon --version
          python -I -m tokenmon --help
